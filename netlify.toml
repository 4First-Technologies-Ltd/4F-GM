[build]
  base = "gas-monitor-web-v2"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://gas-monitor-backend-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server:server"
  status = 200

[[redirects]]
  from = "/_next/static/*"
  to = "/gas-monitor-web-v2/.next/static/:splat"
  status = 200

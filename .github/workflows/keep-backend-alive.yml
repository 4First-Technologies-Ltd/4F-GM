name: Keep backend alive

on:
  schedule:
    # Render free tier spins down after 15 min idle. GitHub's scheduler can
    # run a few minutes late, so ping every 10 min to stay safely under that.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL repo variable is not set — skipping."
            exit 1
          fi
          # Render free tier can take 50-60s to wake from a cold start, so allow
          # a generous per-try timeout plus a couple of retries.
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "$BACKEND_URL/health"

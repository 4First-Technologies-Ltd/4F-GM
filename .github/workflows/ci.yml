name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gas-monitor-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gas-monitor-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fails the build on known high/critical vulnerabilities in production deps.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI, not gitleaks/gitleaks-action: the action refuses to run on
      # organisation-owned repos without a paid GITLEAKS_LICENSE (it failed in 5s,
      # scanning nothing). The CLI is free. Pinned, and the download is checked
      # against the checksum from the official release before it is ever executed.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      # Scans the full history. Reviewed false positives are listed by exact
      # fingerprint in .gitleaksignore, so a new leak anywhere still fails the build.
      - name: Scan for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --verbose
